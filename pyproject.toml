[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-scheme"
version = "0.1.0"
description = "Repository skeleton and CI conventions, applied and kept in sync across generated projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "copier>=9.0.0",
  "jsonschema>=4.21",
  "pyyaml>=6.0",
]

[project.scripts]
ai-scheme = "ai_scheme.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_scheme"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Recent ruff versions format Python inside markdown fences. The guides show
# deliberately wrong code next to the corrected version, so formatting them
# would rewrite the lesson.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: renders the real template; part of the full tier, skipped by `-m 'not slow'`",
]
