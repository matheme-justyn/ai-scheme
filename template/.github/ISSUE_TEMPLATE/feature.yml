# Feature issue form.
#
# Three fields, all of them load-bearing. The twenty-field templates this
# replaces were filled in by nobody -- see ai-scheme #7.

name: Feature
description: A shared outcome that several tasks add up to.
labels: ["type:feature", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建立前先用 2-4 個具體詞搜尋 open 與 closed issues。沿用、取代或駁回既有決策時，寫進「補充」。
        Feature 是尚未完成的共同成果；Task 與 Bug 以 sub-issue 掛在它下面。
  - type: textarea
    id: problem
    attributes:
      label: 問題
      description: 現在是什麼狀況，為什麼不能維持現狀。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成條件
      description: 可勾選的清單。每一條都要能被別人檢查。
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補充
      description: 取捨、相依、驗證方式、沿用或駁回的既有決策。
    validations:
      required: false
