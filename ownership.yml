# File ownership manifest
#
# The single source of truth for "who owns which path" in a generated project.
# `copier.yml`'s _exclude / _skip_if_exists, the uninstall documentation, the
# adopt report, and the update conflict rules are all derived from this file --
# nothing re-states the list by hand.
#
# See ADR 0008. This replaces the directory-name isolation of ADR 0005.

version: 1

# Every entry's `kind` must be one of these. The semantics are what `update`
# does to a path that already exists in the target project.
kinds:
  template:
    summary: Rendered by the template and overwritten on update.
    update: overwrite
    uninstall: delete
  project:
    summary: Seeded once at create time, never touched again.
    update: never-touch
    uninstall: keep
  managed-block:
    summary: Only the delimited block is rendered; the rest belongs to the project.
    update: replace-block
    uninstall: remove-block
  merge:
    summary: Ordered union with what the project already has; no line is removed.
    update: union
    uninstall: remove-contributed-lines
  generated:
    summary: Rebuilt from a declared source; never edited directly.
    update: regenerate
    uninstall: delete

# Paths that exist in this template repository but must never be copied into a
# generated project. These become copier.yml's _exclude.
template_repo_only:
  - copier.yml
  - ownership.yml
  - .git

paths:
  # --- Template infrastructure -------------------------------------------
  - path: .scheme/config.yml
    kind: template
    note: Copier answers file. The single source of skeleton-layer settings.
  - path: .scheme/provenance.json
    kind: generated
    source: the lifecycle command that applied the template
    note: >-
      Which release this project was applied from: tag, the full commit it
      resolved to, when, and by which CLI version. Rewritten on every apply.
  - path: .scheme/README.md
    kind: template
    note: >-
      Orientation for the answers file. Copier owns the header of config.yml
      itself, so the explanation of why a project can hold two configuration
      files lives beside it rather than inside it -- see ADR 0008.
  - path: ownership.yml
    kind: template
    note: This file.
  - path: schemas/
    kind: template
  - path: scripts/
    kind: template
    note: Lifecycle and verification entry points.
  - path: hooks/
    kind: template
  - path: .github/workflows/
    kind: template
  - path: .github/ISSUE_TEMPLATE/
    kind: template
  - path: .github/PULL_REQUEST_TEMPLATE.md
    kind: template
  - path: .gitleaks.toml
    kind: template
    note: Secret scanning rules, so the same ones apply everywhere.
  - path: policies/
    kind: template
    note: Declared policy the checks read -- link exceptions, and more to come.
  - path: i18n/
    kind: template
  - path: .vscode/
    kind: template
    note: Editor settings the skeleton keeps in step, plus their explanation.

  # --- Documentation the template maintains ------------------------------
  - path: docs/guides/
    kind: template
    note: Style, git workflow, documentation and writing guides.
  - path: docs/terminology/
    kind: template
  - path: docs/templates/
    kind: template
    note: Document templates a project fills in, such as the PRD skeleton.
  - path: docs/uninstall.md
    kind: generated
    source: ownership.yml
  - path: docs/collaboration-modes.md
    kind: template
    note: What solo and team mode change, crossed with release_phase.
  - path: docs/README.md
    kind: template
    note: >-
      The documentation map: which of the four layers a thing belongs in, and
      what never belongs in the repository at all.
  - path: docs/milestone-description.md
    kind: template
    note: When a milestone is worth creating, and what its description says.
  - path: docs/config-boundary.md
    kind: template
    note: >-
      Why a project sees both .scheme/config.yml and config.toml, and which
      layer owns which keys.
  - path: docs/status-interface-contract.md
    kind: template
    note: >-
      Defines how an agent calls this layer's lifecycle interface. Deliberately
      not named "install" -- see ADR 0007.

  # --- Project content, seeded once --------------------------------------
  - path: docs/adr/
    kind: project
    note: >-
      Decision records belong to the project. The template seeds ADR 0001 and
      the README, then never touches this directory again.
  - path: docs/specs/
    kind: project
  - path: src/
    kind: project
  - path: tests/
    kind: project
  - path: CHANGELOG.md
    kind: project
  - path: LICENSE
    kind: project

  # --- Mixed ownership ---------------------------------------------------
  - path: AGENTS.md
    kind: managed-block
    block: ai-scheme:conventions
    note: >-
      The template owns the conventions block. Everything outside it is the
      project's, including any project-specific agent instructions.
  - path: .gitignore
    kind: merge
    note: >-
      Language profile patterns are appended as a delimited section. Existing
      project entries are never removed.
  - path: README.md
    kind: generated
    source: i18n/locales/<readme_primary_language>/readme.toml
    note: >-
      Regenerated from the i18n sources plus the answers file. Edit the sources,
      not the output. Additional language files follow readme_strategy.
