# Attaches the evidence to a release that has just been published.
#
# A tag with a changelog is not a release: what makes it one is an artefact
# somebody can download, a checksum they can check it against, a bill of
# materials saying what is inside, and an attestation saying where it was
# built. The artefacts are re-downloaded and re-hashed before this job is
# allowed to finish -- publishing something nobody verified is the failure this
# step exists to prevent.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach artefacts to
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build the artefacts and their checksums
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/publish-release build --tag "$TAG" --out dist

      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Download what was published and check it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/publish-release verify --tag "$TAG" --out verify
