# Turns merged pull request titles into a version pull request.
#
# It opens or updates one pull request that bumps the manifest and writes the
# changelog. Merging that pull request is the decision to release; this
# workflow never publishes anything by itself.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
